apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-database
  namespace: zero-trust-lab
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: database
      ports:
        - protocol: TCP
          port: 6379
